name: CI

# Runs on every PR (not path-filtered) and on push to `main`.
#
# Layout:
#
#   changes ──┬── lint    (ruff check + ruff format --check)
#             ├── test    (unit + integration, coverage floor from pyproject.toml)
#             └── docker  (build only, no push)
#                    └── ci-ok   (aggregator — the ONLY required status check)
#
# `ci-ok` exists so the `main` ruleset requires a single, stable check name:
# adding, renaming or splitting jobs never means editing the ruleset again.
# It runs `if: always()` and fails when any upstream job failed or was
# cancelled; `skipped` counts as success.
#
# Docs-only changes still start the workflow, but `changes` detects that only
# Markdown was touched, the expensive jobs are skipped, and `ci-ok` reports
# green in seconds. Do NOT replace this with `paths-ignore`: that stops the
# workflow from running at all, and the required check never reports.
#
# Public-repo safety: fork PRs run under `pull_request` (never
# `pull_request_target`) with a read-only token and no secrets; this workflow
# needs no secrets. Actions are pinned to commit SHAs (Dependabot bumps them).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Supersede stale PR runs; never cancel a run on `main`.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect non-Markdown changes
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Fall back to running the full suite whenever the base commit is
          # unusable (force push, first push to a branch, shallow history).
          if [ -z "${BASE_SHA}" ] \
            || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "base commit unavailable — running full suite"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          echo "Changed files:"
          echo "${changed}"

          # `grep -v` (not `grep -qv`): under `pipefail`, `-q` closes the pipe
          # early and the SIGPIPE from printf would fail the whole pipeline,
          # misreading code changes as docs-only.
          non_md="$(printf '%s\n' "${changed}" | grep -vE '\.md$' || true)"

          # `prompts/*.md` is not documentation: it is loaded at runtime and
          # covered by tests/unit/test_prompts.py, so it must run the suite.
          prompt_md="$(printf '%s\n' "${changed}" | grep -E '(^|/)prompts/.*\.md$' || true)"

          if [ -n "${non_md}" ] || [ -n "${prompt_md}" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only change — skipping lint, tests and docker build"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check --output-format=github

      - name: Format (ruff format --check)
        run: uv run ruff format --check

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      # One pytest run so coverage is measured once over unit + integration.
      # The floor (`fail_under`) lives in pyproject.toml, so a local
      # `uv run pytest tests/unit tests/integration --cov` enforces the same gate.
      - name: Unit + integration tests with coverage
        run: >-
          uv run pytest tests/unit tests/integration
          --cov
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html

      - name: Coverage summary
        if: always()
        run: |
          [ -f .coverage ] || { echo "no coverage data (tests did not run)"; exit 0; }
          {
            echo "## Coverage (unit + integration)"
            echo
            uv run coverage report --format=markdown --fail-under=0
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 14

  # Gating build only — no push, no registry. `flyctl deploy` builds the
  # image on Fly's remote builder at release time, which is too late to
  # catch a broken Dockerfile. The build context is the repo root, same as
  # `flyctl deploy`.
  docker:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Docker build
        run: docker build -t fly-swe:ci .

  ci-ok:
    needs: [changes, lint, test, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All required jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::an upstream job finished with '${r}'"; exit 1 ;;
            esac
          done
