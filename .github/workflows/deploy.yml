name: Deploy

# Trunk-based release: merges land on `main` without deploying. Publishing a
# GitHub Release (tag `vX.Y.Z`, matching `pyproject.toml`) ships that commit to
# Fly. `workflow_dispatch` re-runs it for a manual redeploy or rollback.
# See AGENTS.md § Git Convention.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: default
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Tag matches pyproject version
        if: github.event_name == 'release'
        run: |
          pyproject_version=$(grep -E '^version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pyproject_version" != "$tag" ]; then
            echo "::error::Release tag v$tag != pyproject.toml version $pyproject_version"
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --app "$FLY_APP"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ vars.FLY_APP }}

      - name: Wait for deployment to settle
        run: sleep 10

      - name: Smoke test — healthz
        run: curl -sfS "https://${FLY_APP}.fly.dev/healthz"
        env:
          FLY_APP: ${{ vars.FLY_APP }}

      - name: Smoke test — readyz
        run: curl -sfS "https://${FLY_APP}.fly.dev/readyz"
        env:
          FLY_APP: ${{ vars.FLY_APP }}
