name: Bug report
description: Something in fly-swe doesn't behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. **Do not paste secrets**
        (API keys, the GitHub App private key, webhook secrets) or the body of
        a private issue into this form. For a security vulnerability, follow
        [SECURITY.md](https://github.com/stateway-io/fly-swe/blob/main/SECURITY.md)
        instead of opening an issue.
  - type: input
    id: version
    attributes:
      label: Version
      description: The `version` in `pyproject.toml`, or the release tag you deployed.
      placeholder: "1.1.8"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Where does it run?
      options:
        - Fly.io (Dockerfile / fly.toml from this repo)
        - Locally (`uv run honcho start`)
        - Other container platform
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Forge / provider
      description: The provider type of the instance involved, and whether it is self-hosted.
      placeholder: "github (github.com)"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the trigger (label, comment) and what the agent or service did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The relevant parts of `config.yaml` (no secrets) and the steps that lead to the problem.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant structured log lines (`flyctl logs` or local output). Redact tokens and private content.
      render: text
