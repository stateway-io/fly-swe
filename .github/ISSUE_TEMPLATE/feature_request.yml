name: Feature Request
description: Suggest an improvement or a new capability for fly-swe.
title: "[Feature] "
labels: ["feature-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea! A clear proposal helps us evaluate it.

  - type: input
    id: title
    attributes:
      label: Summary
      description: A short, clear description of your suggestion
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: How would you like fly-swe to behave? Describe the feature in detail.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why is this useful?
      description: What are you trying to do, and what gets in the way today? Who would benefit?
    validations:
      required: true

  - type: textarea
    id: alternative
    attributes:
      label: Current workaround
      description: Workarounds or other approaches you have looked at.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Provider plugin (a new forge or a provider port)
        - Toolchain (runtime provisioning for target repos)
        - Policy (labels, guards, comment filters)
        - Runner / agent execution
        - Queue, budgets or observability
        - Deployment / configuration
        - Documentation
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - low
        - medium
        - high
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Attachments
      description: If applicable, attach diagrams, config sketches, or links to related issues.
    validations:
      required: false
