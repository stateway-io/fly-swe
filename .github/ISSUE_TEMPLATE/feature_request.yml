name: Feature request
description: Suggest an improvement or a new capability for fly-swe.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like fly-swe to behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you have looked at.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Provider plugin (a new forge or a provider port)
        - Toolchain (runtime provisioning for target repos)
        - Policy (labels, guards, comment filters)
        - Runner / agent execution
        - Queue, budgets or observability
        - Deployment / configuration
        - Documentation
